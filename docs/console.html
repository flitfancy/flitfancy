<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>控制台 — 云萤 · flitfancy</title>
  <meta name="description" content="小流萤的控制台：实时数据与对话。">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="console-page">
  <canvas id="sky" aria-hidden="true"></canvas>

  <header class="nav">
    <a class="brand" href="index.html">云萤 · FlitFancy</a>
    <nav>
      <a href="index.html">首页</a>
      <a href="project.html">技术栈</a>
      <a href="journal.html">日志</a>
      <a href="console.html" class="active">控制台</a>
      <a href="about.html">关于</a>
    </nav>
  </header>

  <main>
    <section class="section">
      <div class="console-status">
        <span class="dot" data-role="dot"></span>
        <span data-role="status">正在连接服务…</span>
      </div>

      <div class="live-strip" data-role="live-strip">—</div>

      <div class="console-panel">
        <h2>对话</h2>
        <div class="chat-log" data-role="chat-log">
          <p class="chat-empty" data-role="chat-empty">说点什么吧，AI 会回复。</p>
        </div>
        <div class="chat-form">
          <textarea rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）" data-role="chat-input"></textarea>
          <button class="btn" data-role="chat-send" title="发送">说</button>
        </div>
        <p class="hint" data-role="chat-status" style="margin-top:10px"></p>
      </div>
    </section>
  </main>

  <footer>
<p><span>云萤 · FlitFancy</span><span class="sep"> · </span><span>献给我们所热爱的一切</span></p>
  </footer>

  <script src="assets/firefly.js"></script>
  <script src="assets/console.js"></script>
</body>
</html>
