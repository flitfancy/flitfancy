<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://flitfancy.com/remote.html">
  <meta name="description" content="云萤公网对话总闸：一键开关公网 AI 对话。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='24' fill='%23f5b84b' opacity='0.22'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23f5b84b'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ffe9c4'/%3E%3C/svg%3E">
  <title>远程总闸 — 云萤 · FlitFancy</title>
  <link rel="stylesheet" href="assets/style.css?v=1.0.1">
  <link rel="stylesheet" href="assets/remote.css?v=1.0.1">
  <script src="assets/track.js?v=1.0.1" defer></script>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main>
    <section class="section">
      <div class="console-panel remote-card">
        <h2>远程总闸</h2>
        <p class="hint">只控制公网聊天（api.flitfancy.com），本地控制台不受影响。</p>
        <div class="remote-status" data-role="status">正在读取公网状态…</div>
        <div class="remote-actions">
          <button class="btn" data-role="off">关闭公网聊天</button>
          <button class="btn" data-role="on">开启公网聊天</button>
        </div>
        <div class="remote-token">
          <input type="password" data-role="token" placeholder="输入管理令牌" autocomplete="off">
          <button class="btn btn-ghost" data-role="save">记住令牌</button>
        </div>
        <p class="hint remote-msg" data-role="msg"></p>
        <p class="hint remote-links"><a class="back-link" href="index.html">回首页</a> · <a class="back-link" href="console.html">控制台</a></p>
      </div>
    </section>
  </main>
  <script src="assets/firefly.js?v=1.0.1"></script>
  <script src="assets/sitefx.js?v=1.0.1"></script>
  <script src="assets/admin-core.js?v=1.0.1"></script>
  <script src="assets/remote.js?v=1.0.1"></script>
</body>
</html>
